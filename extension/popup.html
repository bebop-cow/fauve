<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font: 13px system-ui, sans-serif; padding: 10px; }
    label { display: block; margin-top: 6px; }
    input { width: 100%; box-sizing: border-box; }
    button { margin-top: 10px; width: 100%; }
  </style>
</head>
<body>
  <label>Full name <input id="name"></label>
  <label>Email <input id="email" type="email"></label>
  <label>Phone <input id="phone"></label>

  <button id="save">Save for this browser session</button>
  <button id="fill">Fill this page</button>
  <p id="msg"></p>
  <script type = "module" src="popup.js"></script>
</body>
</html>
