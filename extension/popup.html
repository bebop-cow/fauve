<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face{font-family:'Josefin Sans';font-weight:300;src:url(fonts/josefin-sans-latin-300-normal.woff2) format('woff2')}
    @font-face{font-family:'Courier Prime';font-weight:700;src:url(fonts/courier-prime-latin-700-normal.woff2) format('woff2')}
    @font-face{font-family:'Libre Franklin';font-weight:400;src:url(fonts/libre-franklin-latin-400-normal.woff2) format('woff2')}
    @font-face{font-family:'Libre Franklin';font-weight:600;src:url(fonts/libre-franklin-latin-600-normal.woff2) format('woff2')}
    :root {
      --bg:#0b1228; --panel:#141d3d; --well:#101833; --ink:#f3e9d2; --muted:#aeb4cc;
      --gold:#ddb13c; --line:rgba(243,233,210,.16);
      --display:"Josefin Sans","Futura","Century Gothic",sans-serif;
      --label:"Courier Prime","Courier New",ui-monospace,monospace;
      --body:"Libre Franklin","Helvetica Neue",system-ui,sans-serif;
    }
    *, *::before, *::after { box-sizing:border-box; }
    body { width:300px; margin:0; padding:16px; background:var(--bg); color:var(--ink); font:13px/1.5 var(--body); }
    header { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line); }
    h1 { font:300 26px/1 var(--display); margin:0; letter-spacing:.01em; }
    .kicker { font:700 10px/1 var(--label); letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
    form { display:flex; flex-direction:column; gap:10px; margin:0; }
    label { display:flex; flex-direction:column; gap:4px; font:700 10px/1 var(--label); letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
    input { width:100%; padding:8px 10px; font:400 13px/1.3 var(--body); color:var(--ink); background:var(--well); border:1px solid var(--line); border-radius:8px; outline:none; }
    input:focus { border-color:var(--gold); }
    .actions { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
    button { width:100%; padding:10px 12px; font:700 11px/1 var(--label); letter-spacing:.14em; text-transform:uppercase; border-radius:8px; cursor:pointer; }
    #fill { background:var(--gold); color:var(--bg); border:1.5px solid var(--gold); }
    #fill:hover { background:var(--ink); border-color:var(--ink); }
    #save { background:transparent; color:var(--ink); border:1.5px solid var(--line); }
    #save:hover { border-color:var(--gold); color:var(--gold); }
    #msg { white-space:pre-line; margin:10px 0 0; color:var(--muted); font:400 12px/1.5 var(--label); }
    #msg:empty { display:none; }
  </style>
</head>
<body>
  <header>
    <h1>Houdini</h1>
    <span class="kicker">Session only</span>
  </header>
  <form>
    <label>Full name <input id="name" autocomplete="name"></label>
    <label>Email <input id="email" autocomplete="email" type="email"></label>
    <label>Phone <input id="phone" autocomplete="tel" type="tel"></label>
    <label>City, State <input id="place" autocomplete="address-level2"></label>
    <div class="actions">
      <button id="fill" type="button">Fill this page</button>
      <button id="save" type="button">Save for this browser session</button>
    </div>
  </form>
  <p id="msg"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
