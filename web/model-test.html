<!DOCTYPE html>
<meta charset="utf-8"><title>Model test</title>
<pre id="log"></pre>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";
const log = (t) => { document.getElementById("log").innerText += t + "\n"; };
console.log(webllm.prebuiltAppConfig.model_list.map(m => m.model_id));   // lists the real model names
const engine = await webllm.CreateMLCEngine("Hermes-3-Llama-3.2-3B-q4f16_1-MLC", {                     
  initProgressCallback: (p) => log(p.text),
});
const reply = await engine.chat.completions.create({
  messages: [{ role: "user", content: "Say hi in five words." }],
});
log(reply.choices[0].message.content);
</script>
